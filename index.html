<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Log Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --blue: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .status {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.down { background: var(--red); }
  .controls { display: flex; gap: 10px; align-items: center; }
  button, input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--blue); }
  input[type="text"] { cursor: text; width: 200px; }
  label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }

  #log {
    height: calc(100vh - 60px);
    overflow-y: auto;
    padding: 12px 20px;
    font-family: "SF Mono", Consolas, Menlo, monospace;
    font-size: 13px;
    line-height: 1.6;
  }
  .line { white-space: pre-wrap; word-break: break-all; border-bottom: 1px solid rgba(255,255,255,0.03); padding: 2px 0; }
  .line.hidden { display: none; }
  .lvl-error { color: var(--red); }
  .lvl-warn { color: var(--yellow); }
  .lvl-info { color: var(--green); }
  .lvl-debug { color: var(--muted); }
  #empty { color: var(--muted); padding: 20px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>📄 Live Log Viewer</h1>
  <div class="controls">
    <input type="text" id="filter" placeholder="Filter text...">
    <label><input type="checkbox" id="autoscroll" checked> Auto-scroll</label>
    <button id="clearBtn">Clear</button>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting...</span></div>
  </div>
</header>

<div id="log"><div id="empty">Waiting for log lines...</div></div>

<script>
const logEl = document.getElementById("log");
const emptyEl = document.getElementById("empty");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const autoscroll = document.getElementById("autoscroll");
const filterInput = document.getElementById("filter");
const clearBtn = document.getElementById("clearBtn");

function levelClass(line) {
  const l = line.toLowerCase();
  if (l.includes("error") || l.includes("critical")) return "lvl-error";
  if (l.includes("warn")) return "lvl-warn";
  if (l.includes("info")) return "lvl-info";
  if (l.includes("debug")) return "lvl-debug";
  return "";
}

function addLine(text) {
  if (emptyEl) emptyEl.remove();
  const div = document.createElement("div");
  div.className = "line " + levelClass(text);
  div.textContent = text;
  const q = filterInput.value.trim().toLowerCase();
  if (q && !text.toLowerCase().includes(q)) div.classList.add("hidden");
  logEl.appendChild(div);
  if (autoscroll.checked) logEl.scrollTop = logEl.scrollHeight;
}

filterInput.addEventListener("input", () => {
  const q = filterInput.value.trim().toLowerCase();
  document.querySelectorAll("#log .line").forEach(div => {
    div.classList.toggle("hidden", q && !div.textContent.toLowerCase().includes(q));
  });
});

clearBtn.addEventListener("click", () => { logEl.innerHTML = ""; });

function connect() {
  const es = new EventSource("/stream");
  es.onopen = () => {
    statusDot.className = "dot live";
    statusText.textContent = "Live";
  };
  es.onmessage = (e) => {
    try { addLine(JSON.parse(e.data)); } catch (_) { addLine(e.data); }
  };
  es.onerror = () => {
    statusDot.className = "dot down";
    statusText.textContent = "Reconnecting...";
    es.close();
    setTimeout(connect, 2000);
  };
}
connect();
</script>

</body>
</html>
