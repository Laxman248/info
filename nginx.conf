# /etc/nginx/sites-available/live-log-viewer
# Sample Nginx reverse-proxy config for the Flask + Gunicorn app.
# Replace yourdomain.com with your actual domain or server IP.

server {
    listen 80;
    server_name yourdomain.com;

    # Normal page requests
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE stream needs buffering OFF, or the browser won't get live updates
    location /stream {
        proxy_pass http://127.0.0.1:5000/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }
}
